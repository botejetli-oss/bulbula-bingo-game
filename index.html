
<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo 300</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f0f4f8;
  margin: 0;
  padding: 15px;
}
h1 { color: #075e54; }
button {
  padding: 12px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  background: #087f5b;
  color: white;
  font-size: 16px;
}
#board {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;
  max-width: 420px;
  margin: 15px auto;
}
.cell {
  background: white;
  color: #222;
  border: 1px solid #bbb;
  border-radius: 6px;
  padding: 15px 2px;
  font-weight: bold;
}
.cell.marked {
  background: #087f5b;
  color: white;
}
#current { font-size: 28px; font-weight: bold; }
#history { overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1 id="title">Bingo 300</h1>

<button onclick="setLang('om')">Afaan Oromoo</button>
<button onclick="setLang('am')">አማርኛ</button>

<p id="instruction">Lakkoofsa haaraa baasuuf tuqi.</p>
<p id="current">--</p>

<button id="draw" onclick="drawNumber()">Lakkoofsa baasi</button>
<button id="new" onclick="newGame()">Tapha haaraa</button>

<h3 id="cardTitle">Kaardii Bingo kee</h3>
<div id="board"></div>

<h3 id="historyTitle">Lakkoofsota ba'an</h3>
<p id="history">Ammaaf lakkoofsi hin baane.</p>
<h2 id="result"></h2>

<script>
let lang = "om";
let card = [];
let drawn = [];
let marks = new Set();

const words = {
 om: {
  instruction: "Lakkoofsa haaraa baasuuf tuqi.",
  draw: "Lakkoofsa baasi",
  newGame: "Tapha haaraa",
  card: "Kaardii Bingo kee",
  history: "Lakkoofsota ba'an",
  empty: "Ammaaf lakkoofsi hin baane.",
  next: "Lakkoofsi ba'e",
  win: "BAGA GAMMADDE! BINGO!",
  finished: "Lakkoofsi 300 hundi ba'e. Tapha haaraa jalqabi.",
  title: "Bingo 300"
 },
 am: {
  instruction: "አዲስ ቁጥር ለማውጣት ይጫኑ።",
  draw: "ቁጥር አውጣ",
  newGame: "አዲስ ጨዋታ",
  card: "የቢንጎ ካርድዎ",
  history: "የወጡ ቁጥሮች",
  empty: "እስካሁን ቁጥር አልወጣም።",
  next: "የወጣው ቁጥር",
  win: "እንኳን ደስ አለዎት! ቢንጎ!",
  finished: "300ዎቹ ቁጥሮች ወጥተዋል። አዲስ ጨዋታ ይጀምሩ።",
  title: "ቢንጎ 300"
 }
};

function setLang(language) {
 lang = language;
 const w = words[lang];
 document.getElementById("title").textContent = w.title;
 document.getElementById("instruction").textContent = w.instruction;
 document.getElementById("draw").textContent = w.draw;
 document.getElementById("new").textContent = w.newGame;
 document.getElementById("cardTitle").textContent = w.card;
 document.getElementById("historyTitle").textContent = w.history;
 render();
}

function newGame() {
 const pool = Array.from({length: 300}, (_, i) => i + 1);
 for (let i = pool.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [pool[i], pool[j]] = [pool[j], pool[i]];
 }
 card = pool.slice(0, 25);
 drawn = [];
 marks = new Set();
 document.getElementById("current").textContent = "--";
 document.getElementById("result").textContent = "";
 render();
}

function drawNumber() {
 const remaining = [];
 for (let n = 1; n <= 300; n++) {
  if (!drawn.includes(n)) remaining.push(n);
 }
 if (!remaining.length) {
  document.getElementById("result").textContent = words[lang].finished;
  return;
 }
 const n = remaining[Math.floor(Math.random() * remaining.length)];
 drawn.push(n);
 if (card.includes(n)) marks.add(n);
 document.getElementById("current").textContent =
   words[lang].next + ": " + n;
 render();
 if (hasBingo()) {
  document.getElementById("result").textContent = words[lang].win;
 }
}

function hasBingo() {
 for (let r = 0; r < 5; r++) {
  if (card.slice(r*5, r*5+5).every(n => marks.has(n))) return true;
 }
 for (let c = 0; c < 5; c++) {
  if ([0,1,2,3,4].every(r => marks.has(card[r*5+c]))) return true;
 }
 if ([0,1,2,3,4].every(i => marks.has(card[i*5+i]))) return true;
 if ([0,1,2,3,4].every(i => marks.has(card[i*5+4-i]))) return true;
 return false;
}

function render() {
 const board = document.getElementById("board");
 board.innerHTML = "";
 card.forEach(n => {
  const cell = document.createElement("div");
  cell.className = "cell" + (marks.has(n) ? " marked" : "");
  cell.textContent = n;
  board.appendChild(cell);
 });
 document.getElementById("history").textContent =
  drawn.length ? drawn.join(", ") : words[lang].empty;
}

newGame();
</script>
</body>
</html>

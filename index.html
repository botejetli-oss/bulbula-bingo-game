<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulbula Bingo</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f0f7ff;
  padding: 12px;
}
h1 { color: #0757a6; }
#board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 7px;
  max-width: 420px;
  margin: 20px auto;
}
.number {
  background: white;
  border: 2px solid #0875d1;
  border-radius: 8px;
  padding: 14px 0;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}
.number.selected {
  background: #19a65a;
  color: white;
}
p { font-size: 16px; }
</style>
</head>
<body>

<h1>🎱 Bulbula Bingo</h1>
<p>Afaan Oromoo: Lakkoofsa 1 hanga 47 tuqi.</p>
<p>አማርኛ፦ ከ1 እስከ 47 ያሉትን ቁጥሮች ይጫኑ።</p>
<p>💰 Kaffaltii: 10 Birr (Qajeelfama qofa; kaffaltiin hin mirkanoofne)</p>

<div id="board"></div>

<script>
const board = document.getElementById("board");

for (let i = 1; i <= 47; i++) {
  const cell = document.createElement("button");
  cell.className = "number";
  cell.textContent = i;

  cell.onclick = function () {
    cell.classList.toggle("selected");
  };

  board.appendChild(cell);
}
</script>

</body>
</html>
